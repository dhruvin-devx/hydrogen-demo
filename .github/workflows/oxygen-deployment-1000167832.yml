name: Storefront 1000167832

on:
  push:
    branches:
      - main        # production deployment (requires PR merge, never direct push)
      - staging     # staging/preview deployment
  pull_request:
    types: [opened, synchronize, reopened]  # preview deployment per PR

permissions:
  contents: read
  deployments: write
  pull-requests: write  # needed to post preview URL comment on PR

jobs:
  deploy:
    name: Deploy to Oxygen
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*"
          check-latest: true

      - name: Cache node modules
        id: cache-npm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      # Production deploy — only on main branch push (i.e. after PR is merged)
      - name: Deploy to Production
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: npx shopify hydrogen deploy
        env:
          SHOPIFY_HYDROGEN_DEPLOYMENT_TOKEN: ${{ secrets.OXYGEN_DEPLOYMENT_TOKEN_1000167832 }}

      # Staging deploy — on push to staging branch
      - name: Deploy to Staging (Preview)
        if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
        run: npx shopify hydrogen deploy --preview
        env:
          SHOPIFY_HYDROGEN_DEPLOYMENT_TOKEN: ${{ secrets.OXYGEN_DEPLOYMENT_TOKEN_1000167832 }}

      # PR preview deploy — on every pull request
      - name: Deploy PR Preview
        if: github.event_name == 'pull_request'
        run: npx shopify hydrogen deploy --preview
        env:
          SHOPIFY_HYDROGEN_DEPLOYMENT_TOKEN: ${{ secrets.OXYGEN_DEPLOYMENT_TOKEN_1000167832 }}
